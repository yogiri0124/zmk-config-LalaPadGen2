# かな入力 behavior (&kana)。文字 ID (dt-bindings/kana/kana.h) を受け取り、ローマ字のキー列を送る。

description: Kana romaji output behavior

compatible: "zmk,behavior-kana"

include: one_param.yaml

properties:
  tap-ms:
    type: int
    default: 5
    description: 1キーを押してから離すまでの時間 (ms)
  wait-ms:
    type: int
    default: 5
    description: キーを離してから次のキーを押すまでの時間 (ms)
  ime-resync-ms:
    type: int
    default: 1000
    description: >
      かな・記号をこの時間 (ms) 以上打っていなかった後の最初の1文字の前に IME オン (LANGUAGE_1) を送り、
      IME がオフになっていてもローマ字のまま入力されないようにする。0 で無効
