# 左（親機 = central）だけに適用する設定。
# ZMK は config/<シールド名>.conf も読み込むため、このファイルは lalapadgen2_left のビルドにだけ入る。
# 親機でしか意味のない設定をここに置き、右（子機）のビルドで Kconfig 警告が出ないようにする。
# （親機を入れ替えたときは、このファイル名も入れ替えること）

# Trackpad: スクロールの滑らか化（ポインタ処理は親機で行う）
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# 右（子機）の電池残量を取得し、PC へ中継する
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# PC から Num Lock などの点灯状態を受け取る（&sym_hbar が Num Lock の状態を見るため。受け取るのは親機）
CONFIG_ZMK_HID_INDICATORS=y
