# 左（親機 = central）だけに適用する設定。
# ZMK は config/<シールド名>.conf も読み込むため、このファイルは lalapadgen2_left のビルドにだけ入る。
# 共通の config/lalapadgen2.conf と、このファイルの両方が読み込まれる（ZMK v0.3.0 の
# app/keymap-module/modules/modules.cmake は、見つかった .conf をすべて足す。CI のログの「ZMK Config Kconfig:」に両方が出る）。
# 親機でしか意味のない設定をここに置き、右（子機）のビルドで Kconfig 警告が出ないようにする。
# （親機を入れ替えたときは、このファイル名も入れ替えること）

# Trackpad: スクロールの滑らか化（ポインタ処理は親機で行う）
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# 右（子機）の電池残量を取得し、PC へ中継する
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# PC から Num Lock などの点灯状態を受け取る（Alt コードのキー sym_hbar などが Num Lock の状態を見るため。受け取るのは親機）
CONFIG_ZMK_HID_INDICATORS=y

# かな入力・記号キー（lalapad/）: ローマ字の打鍵を並べる behavior queue を多めに確保する（keymap を処理する親機で使う）
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256

# ZMK Studio（親機を USB でつないで使う。studio-rpc-usb-uart の snippet も左のビルドにだけ付けている）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# キー位置の送信（lalapad/src/key_stream.c）: 押したキーの位置を raw HID で PC のアプリ（桜雪）に送る。
# USB では HID の機器をもう1つ増やす（キーボード用の HID_0 と、キー位置の送信用の HID_1）。止めるときは、下の2行とも消す
CONFIG_ZMK_KEY_STREAM=y
CONFIG_USB_HID_DEVICE_COUNT=2
