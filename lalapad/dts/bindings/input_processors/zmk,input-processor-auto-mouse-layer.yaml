# オートマウスレイヤーの入力処理。<&zip_auto_mouse_layer レイヤー番号 解除までのms> のように使う
# （解除までの ms を 0 にすると、時間では解除しない）。カーソル移動・スクロールで有効にする（タップ・ジェスチャーや、
# 触れただけでは有効にしない）。
# マウスレイヤーで &trans 以外（&none を含む）のキーと excluded-positions のキーは、押しても解除せず、離してから時間を数え直す
# （マウスレイヤーより上の有効なレイヤーに &trans 以外があるキーは、そちらが働くので除く）。
# それ以外のキーを押すとすぐに解除する（&trans のキーは下のレイヤーのキーとして入力される）。

description: Input processor that temporarily enables a mouse layer and keeps it while mouse keys are used

compatible: "zmk,input-processor-auto-mouse-layer"

include: ip_two_param.yaml

properties:
  require-prior-idle-ms:
    type: int
    default: 0
    description: 直前のキー入力（キーコードの押下と、トラックパッド由来でない位置の押下）からこの時間（ms）以内のトラックパッド操作では有効にしない。Alt コードを送っている間も有効にしない
  excluded-layers:
    type: array
    default: []
    description: >
      これらのレイヤーが有効な間は、マウスレイヤーを新しく有効にしない（数字・記号レイヤーなど、
      トラックパッドを触ってもマウスレイヤーにしたくないレイヤーを書く）
  excluded-positions:
    type: array
    default: []
    description: マウスレイヤーで &trans でも、マウス操作として扱うキー位置（修飾キー、トラックパッド由来の位置など）
  passive-positions:
    type: array
    default: []
    description: >
      マウスレイヤーに割り当てがあっても、マウス操作として扱わないキー位置。押しても解除せず、時間切れも延ばさない
      （マウスレイヤーで &trans など、ほかのレイヤーのキーが働くときは、ほかのキーと同じく押すと解除する）
  touch-devices:
    type: phandles
    description: INPUT_BTN_TOUCH（触れている=1／離れた=0）を送る入力デバイス。触れている間はレイヤーを時間切れにしない
  touch-stale-ms:
    type: int
    default: 30000
    description: 触れている間にこの時間（ms）そのデバイスから何も届かなければ、離れたとみなす（「離れた」の取りこぼし対策。0 で無効）
