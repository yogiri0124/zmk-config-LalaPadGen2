# トラックパッドをキー操作に変える入力処理。zmk,behavior-tp-keys・zmk,behavior-tp-stroke のキーを押している間だけ、
# トラックパッドの動きをキーの入力に変える（押していない間は何もせず通す）。
# リスナーの入力処理の並びの、速度の調整（scaler）とオートマウスレイヤーより前に入れる。

description: Input processor that turns trackpad movement into behaviors while a tp-keys / tp-stroke key is held

compatible: "zmk,input-processor-tp-keys"

include: ip_zero_param.yaml
