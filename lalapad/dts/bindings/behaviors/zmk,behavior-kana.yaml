# かな入力 behavior (&kana_key)。文字 ID (dt-bindings/kana/kana.h) を受け取り、ローマ字のキー列を送る。

# マクロ（zmk,behavior-macro）の中には置かない（マクロを送る behavior queue の処理の中から、さらに同じキューに
# 並べることになり、待ち時間が効かず、処理が入れ子になってスタックを使う）。
description: Kana romaji output behavior

compatible: "zmk,behavior-kana"

include: one_param.yaml

properties:
  tap-ms:
    type: int
    default: 5
    description: 1キーを押してから離すまでの時間 (ms)
  wait-ms:
    type: int
    default: 5
    description: キーを離してから次のキーを押すまでの時間 (ms)
  ime-resync-ms:
    type: int
    default: 1000
    description: >
      かな・記号をこの時間 (ms) 以上打っていなかった後の最初の1文字の前に IME オン (LANGUAGE_1) を送り、
      IME がオフになっていてもローマ字のまま入力されないようにする（接続先の切り替えやトラックパッドの
      クリック・ジェスチャーの後の最初の1文字の前にも送る）。0 で無効（かな配列モードに入るときだけ送る）
