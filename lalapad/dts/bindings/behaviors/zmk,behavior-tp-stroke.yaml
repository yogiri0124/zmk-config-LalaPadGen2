# トラックパッドの一筆書きでキーを送る behavior（引数なし）。押している間に 1 本指で描いた向きの並びを覚え、
# 指を離したとき（または先にこのキーを離したとき）に、並びが一致する binding を 1 回送る。
# 実際に動きを読むのは、トラックパッドのリスナーに入れた zmk,input-processor-tp-keys。

description: Hold and draw a stroke on the trackpad to send a binding

compatible: "zmk,behavior-tp-stroke"

include: zero_param.yaml

properties:
  strokes:
    type: array
    required: true
    description: >
      向きの並び（dt-bindings/lalapad/tp_keys.h の TP_STROKE1〜4 と TP_UP・TP_DOWN・TP_LEFT・TP_RIGHT。
      例 TP_STROKE2(TP_DOWN, TP_RIGHT)）。bindings と同じ数・同じ順番で書く
  bindings:
    type: phandle-array
    required: true
    description: strokes の同じ順番の並びを描いたときに送るもの
  stroke-step:
    type: int
    default: 300
    description: 1 つの向きとみなす動きの量（トラックパッドの生の値）
  tap-ms:
    type: int
    default: 10
    description: 押してから離すまでの時間 (ms)
