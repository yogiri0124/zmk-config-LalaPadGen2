# トラックパッドの一筆書きでキーを送る behavior（引数なし）。押している間に 1 本指で描いた向きの並びを覚え、
# 指を離したとき（または先にこのキーを離したとき）に、並びが一致する binding を 1 回送る。
# 送るものは子ノード（表）に、レイヤーごと・左右のトラックパッドごとに書く（child-binding）。
# 押している間のタップ・ジェスチャーは捨てる。2 本指のスクロールはそのまま通す。
# 実際に動きを読むのは、トラックパッドのリスナーに入れた zmk,input-processor-tp-keys。

description: Hold and draw a stroke on the trackpad to send a binding

compatible: "zmk,behavior-tp-stroke"

include: zero_param.yaml

properties:
  strokes:
    type: array
    required: true
    description: >
      向きの並び（dt-bindings/lalapad/tp_keys.h の TP_STROKE1〜4 と TP_UP・TP_DOWN・TP_LEFT・TP_RIGHT。
      例 TP_STROKE2(TP_DOWN, TP_RIGHT)）。すべてのレイヤーで共通。表の bindings は、これと同じ数・同じ順番で書く。
      続けて同じ向きに動かしても 1 つの向きとして数えるので、同じ向きを続けて並べたもの
      （TP_STROKE2(TP_UP, TP_UP) など）は描けない。5 つ以上の向きを描いたときは、どれにも一致しない
  stroke-step:
    type: int
    default: 300
    description: 1 つの向きとみなす動きの量（トラックパッドの生の値。1〜65535）
  tap-ms:
    type: int
    default: 10
    description: 押してから離すまで、離してから次を押すまでの時間 (ms。0〜65535)

child-binding:
  description: >
    出すものの表。bindings（left-bindings・right-bindings）は strokes と同じ数・同じ順番で、その並びを描いたときに送るもの。
    layers に書いたレイヤーで使う（layers を書かない表は既定。どのレイヤーの表にもないとき）。
    このキーを押したときに有効なレイヤーを上から見て、そのレイヤーを layers に書いた表を使う。表の中の &trans は、
    その下のレイヤーの表、最後に既定の表を見る。bindings は左右のトラックパッドで共通。left-bindings・right-bindings を
    書くと、そちらのトラックパッドではそれを使う（bindings がないときは、left-bindings・right-bindings の両方が要る）
  properties:
    layers:
      type: array
      description: この表を使うレイヤー（keymap の宣言順の番号。#define の名前を書ける）
    bindings:
      type: phandle-array
      description: 左右共通の出すもの
    left-bindings:
      type: phandle-array
      description: 左のトラックパッドで出すもの（bindings の代わり）
    right-bindings:
      type: phandle-array
      description: 右のトラックパッド（分割の通信で届くもの）で出すもの（bindings の代わり）
