# レイヤーを固定する behavior（引数なし。QMK の Layer Lock）。押すと、このキーを置いたレイヤーを固定する
# （&mo のキーを離しても、オートマウスレイヤーの時間切れでも切れない）。もう一度押すと固定をやめて解除する
# （オートマウスレイヤーなら、ふだんどおり時間を数え直す）。Default と、conditional_layers が有効・解除する
# レイヤー（then-layer）は固定しない。かなのレイヤーの固定は、かなモードを抜けるとやめる（kana_output.c が
# layer_lock_forget を呼ぶ）。
# 固定する前からほかの操作（&tog・かなモードなど）で有効だったレイヤーも、固定をやめると解除する（QMK と同じ。
# かなのレイヤーなら、かなモードも終わる。IME はオンのまま）。
# combos・マクロ・hold-tap（&mt など）の中から押すと、ZMK v0.3.0 はレイヤーを Default として渡すので、何もしない
# （キーマップのレイヤーに直接置く）。

description: Lock the layer this key is on (like QMK Layer Lock)

compatible: "zmk,behavior-layer-lock"

include: zero_param.yaml
